# =====================================================================
# CareShift Guard  nginx 設定
#   本番では OCI Flexible Load Balancer で TLS を終端するため、
#   ここは HTTP で受けて web コンテナへ渡す。
# =====================================================================

upstream web_upstream {
    server web:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # アップロードは CSV 取込のみ。大きなファイルは受け付けない
    client_max_body_size 8m;

    # セキュリティヘッダ
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # 静的ファイルは nginx が直接返す
    location /static/ {
        alias /srv/static/;
        expires 7d;
        access_log off;
    }

    location = /healthz {
        proxy_pass http://web_upstream;
        access_log off;
    }

    # -----------------------------------------------------------------
    # シフト自動生成だけは待ち時間の性質が違う。
    #
    #   SOLVER_TIME_LIMIT は app/config.py が 1〜300 秒を許容する。
    #   ここを一律 60 秒にしていたため、制限を 60 秒に上げた時点で
    #   nginx 側が先に諦めて 504 Gateway Time-out を返した。
    #   求解そのものは成功していたのに画面には 504 しか出ない、
    #   という最も原因を追いにくい壊れ方をする。
    #
    #   そのため許容上限 300 秒 ＋ 余裕 30 秒 を生成経路にだけ与える。
    #   他の経路は 60 秒に据え置く（長く待たせる理由がなく、
    #   待ち続ける接続を増やしてもコネクションを浪費するだけ）。
    # -----------------------------------------------------------------
    location = /schedules/generate {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        # $host はポートを含まない。含まないと、アプリが組み立てる
        # 絶対URL（パスワード再設定リンク）からポートが落ちて
        # 開けないリンクになる。$http_host は要求のまま渡す。
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
    }

    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        # $host はポートを含まない。含まないと、アプリが組み立てる
        # 絶対URL（パスワード再設定リンク）からポートが落ちて
        # 開けないリンクになる。$http_host は要求のまま渡す。
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
