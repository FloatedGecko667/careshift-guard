name: 秘密情報スキャン

# 目的
#   公開リポジトリでは、一度 push した秘密情報は履歴から消しても
#   他者のクローンと GitHub のキャッシュに残るため回復できない。
#   .gitignore は「うっかり」を防ぐが、新しい命名のファイルや
#   ソース中への直書きは素通りする。ここで機械的に止める。
#
# GitHub 側の Secret scanning / Push protection と役割が異なる。
#   ・Push protection … 既知のプロバイダ形式（AWS キー等）を push 時に拒否する
#   ・gitleaks        … 汎用のパターンとエントロピーで、自作の秘密も拾う
#   両方を通して初めて穴が塞がる。

on:
  push:
    branches: [main]
  pull_request:
  # 週に一度、履歴全体を走査し直す。
  # 検出ルールは更新されるため、過去のコミットが後から該当することがある。
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # 履歴全体を取得する。0 を指定しないと直近のコミットしか見ない。
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks で走査する
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 検出内容そのものはログに出さない。
          # 公開リポジトリの Actions ログは誰でも読めるため、
          # 「秘密を検出した」と報告するログ自体が秘密の漏洩経路になる。
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
