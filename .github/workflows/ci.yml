name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: ruff を導入する
        run: pip install ruff

      - name: 静的解析
        run: ruff check .

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # 勤務形態一覧表の Excel 数式を実際に評価して検証するために使う。
      # 無い場合は該当テストが skip される設計なので、失敗はしない。
      - name: LibreOffice を導入する
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-calc

      - name: 依存を導入する
        run: pip install -e '.[dev]'

      - name: テスト
        run: pytest -v --durations=10

  sql:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"
          cache: pip

      # PostgreSQL 本体のパーサ（libpg_query）で構文を検証する。
      # サーバを起動せずに DDL の妥当性を確認できる。
      - name: pglast を導入する
        run: pip install pglast

      - name: schema.sql と seed.sql の構文を検証する
        run: |
          python3 - <<'PY'
          import pglast, sys
          ok = True
          for f in ("db/schema.sql", "db/seed.sql"):
              try:
                  n = len(pglast.parse_sql(open(f, encoding="utf-8").read()))
                  print(f"{f}: 構文エラーなし（文数 {n}）")
              except Exception as e:
                  print(f"{f}: 構文エラー -> {e}")
                  ok = False
          sys.exit(0 if ok else 1)
          PY
