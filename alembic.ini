; =====================================================================
; Alembic 設定
;   スキーマは db/schema.sql を唯一の正とし、
;   初回リビジョンでそれを実行する（SQL-first migrations）。
;   SQLAlchemy のモデル定義とスキーマを二重管理しない方針。
;   接続文字列は環境変数 DATABASE_URL から読む（migrations/env.py 参照）。
; =====================================================================
[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
timezone = Asia/Tokyo

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
