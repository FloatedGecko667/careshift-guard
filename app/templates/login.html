{% extends "base.html" %}
{% set show_nav = false %}
{% block title %}ログイン｜CareShift Guard{% endblock %}

{% block content %}
<div class="card" style="max-width:420px;margin:6vh auto">
  <h1 style="text-align:center">CareShift <span style="color:var(--accent)">Guard</span></h1>
  <p class="muted" style="text-align:center;margin-top:-6px">
    人員配置基準チェック内蔵 シフト自動作成
  </p>

  {% if error %}
    <div class="alert err" style="margin-top:14px">{{ error }}</div>
  {% endif %}

  <form method="post" action="/login" style="margin-top:14px">
    <div style="margin-bottom:12px">
      <label for="email">メールアドレス</label>
      <input id="email" name="email" type="email" required autocomplete="username"
             autofocus value="{{ email | default('') }}">
    </div>
    <div style="margin-bottom:16px">
      <label for="password">パスワード</label>
      <input id="password" name="password" type="password" required
             autocomplete="current-password">
    </div>
    <button class="btn primary" type="submit" style="width:100%">ログイン</button>
  </form>

  {% if app_env and app_env != 'production' %}
    <p class="muted" style="margin-top:14px;text-align:center">
      稼働環境: {{ app_env }}
    </p>
  {% endif %}
</div>
{% endblock %}
