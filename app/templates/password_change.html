{% extends "base.html" %}
{% block title %}パスワードの変更｜CareShift Guard{% endblock %}

{% block content %}
<h1>パスワードの変更</h1>

<div class="card" style="max-width:460px">
  {% if error %}
    <div class="alert err">{{ error }}</div>
  {% endif %}

  <form method="post" action="/password/change">
    <div style="margin-bottom:12px">
      <label for="current_password">現在のパスワード</label>
      <input id="current_password" name="current_password" type="password"
             required autocomplete="current-password" autofocus>
    </div>
    <div style="margin-bottom:12px">
      <label for="password">新しいパスワード</label>
      <input id="password" name="password" type="password" required
             minlength="12" autocomplete="new-password">
    </div>
    <div style="margin-bottom:16px">
      <label for="password_confirm">新しいパスワード（確認）</label>
      <input id="password_confirm" name="password_confirm" type="password"
             required minlength="12" autocomplete="new-password">
    </div>
    <button class="btn primary" type="submit">変更する</button>
  </form>

  <p class="muted" style="margin-top:14px">
    12文字以上にしてください。記号や大文字の混在は求めません。
    推測されやすい語とメールアドレスの一部は使えません。
  </p>
  <p class="muted">
    変更すると、<strong>他の端末のログインはすべて切れます</strong>。
    いま操作している端末だけはそのまま続けられます。
  </p>
</div>
{% endblock %}
