# =====================================================================
# CareShift Guard  Docker Compose 構成
#
#   nginx : リバースプロキシ・静的配信・TLS 終端
#   web   : FastAPI + Jinja2 + OR-Tools（シフト最適化を同期実行）
#   db    : PostgreSQL 18
#
# 秘密情報はすべて .env から読み込む。compose.yaml に直接書かない。
# =====================================================================

name: careshift-guard

services:
  nginx:
    image: nginx:1.28-alpine
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/static:/srv/static:ro
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # デモ・検証時はコンテナ自身にテストを実行させたいため true にする。
        # 顧客提供時は既定の false のままにする（pglast を含めない）。
        INSTALL_DEV: ${INSTALL_DEV:-false}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+pg8000://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      APP_ENV: ${APP_ENV:-development}
      SOLVER_TIME_LIMIT: ${SOLVER_TIME_LIMIT:-10}
      SOLVER_WORKERS: ${SOLVER_WORKERS:-2}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # 日本語のソート順・全文検索のために照合順序を明示する
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
